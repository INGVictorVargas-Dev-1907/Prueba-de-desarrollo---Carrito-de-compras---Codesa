services:
  db:
    image: postgres:16-alpine
    container_name: codesa-postgres
    restart: always
    environment:
      POSTGRES_DB: codesa_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codesa_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesa-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: codesa_shop
      DB_USER: postgres
      DB_PASSWORD: password

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesa-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data: